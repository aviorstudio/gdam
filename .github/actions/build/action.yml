name: Build
description: >
  Everything a release ships: the binary for every supported platform, archived,
  with checksums.

  A composite action rather than a reusable workflow so it runs in the caller's
  job, under the caller's name -- CI / Build, Release / Build -- rather than as
  a nested "caller / callee" check.

  This replaces two different builds. CI ran scripts/cli_build.sh, which
  produces ONE host binary with no version stamped into it; release.yml
  cross-compiled six targets inline with its own loop. Only the CI path ran on a
  pull request, so a break in any of the six -- a build tag, a
  platform-specific import, a syscall that does not exist on windows -- surfaced
  first at release time, on the one build nobody is watching.

  Now a pull request builds exactly what a release builds. The only difference
  is the version stamped in, and that one of them goes on to publish.

  scripts/cli_build.sh stays. It is the fast host build for the person at the
  terminal, and it is not what CI checks any more.

  NOTHING LEAVES THE RUNNER. The archives are left in ./dist. Creating the
  release is a step the caller writes out, so nothing named "build" can publish
  as a side effect of being reused -- and it has no token to publish with.

  Assumes Go is already set up. See ../test.

inputs:
  version:
    description: >
      What the binary reports for `gdam version`, baked in with -X.

      Defaults to "dev" rather than being required, because a pull request has
      no version and should not have to invent one -- and "dev" is the honest
      answer for a binary built from a working tree that may match no tag.
    required: false
    default: dev
  commit:
    description: The commit stamped into the binary alongside the version.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build and verify exact release archives
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        COMMIT: ${{ inputs.commit }}
      run: make build artifact-smoke

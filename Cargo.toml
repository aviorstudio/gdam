[package]
name = "gdam"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
build = "build.rs"

[lib]
path = "lib.rs"

[[bin]]
name = "gdam"
path = "main.rs"

[dependencies]
cap-std = "=3.4.6"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
getrandom = "0.4"
regex = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
cap-primitives = "=3.4.6"

[patch.crates-io]
cap-primitives = { path = "vendor/cap-primitives" }
